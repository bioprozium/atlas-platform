[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-api"
version = "0.1.0"
description = "Open 3D Atlas REST API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.165,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "httpx2>=2,<3",
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a disposable local PostgreSQL 16 database"]
